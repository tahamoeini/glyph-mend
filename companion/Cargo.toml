[workspace]
resolver = "2"
members = [
  "crates/companion-contract",
  "crates/companion-core",
  "crates/companion-extractor",
  "crates/companion-service",
  "crates/companion-bridge",
  "crates/companion-cli",
  "apps/companion-tauri/src-tauri",
]
default-members = [
  "crates/companion-contract",
  "crates/companion-core",
  "crates/companion-extractor",
  "crates/companion-service",
  "crates/companion-bridge",
  "crates/companion-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
bytes = "1.12.1"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pdfium-render = { version = "0.9.4", features = ["thread_safe", "image_latest", "pdfium_latest"] }
leptess = "0.14.0"
image = { version = "0.25.9", default-features = false, features = ["tiff"] }
rayon = "1.11.0"
sha2 = "0.11.0"
subtle = "2.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"
