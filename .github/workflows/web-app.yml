name: GlyphMend browser app
on:
  push:
    branches: [main]
    paths: ["branding.json", "brand/**", "web-app/**", "pyproject.toml", "docs/upgrade/DEPENDENCY_LICENSES.md", ".github/workflows/web-app.yml"]
  pull_request:
    paths: ["branding.json", "brand/**", "web-app/**", "pyproject.toml", "docs/upgrade/DEPENDENCY_LICENSES.md", ".github/workflows/web-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run license:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: glyphmend-browser
          path: web-app/dist
          if-no-files-found: error
          retention-days: 14
