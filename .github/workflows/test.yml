name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest
      - name: Smoke-test installed commands
        shell: bash
        run: |
          pdf-sanitizer --help
          pdf-sanitizer gui --help
          md-to-docx --help
          python -m pdf_sanitizer --help
          python -c "import pdf_sanitizer, pdf_sanitizer.gui; print(pdf_sanitizer.__version__)"

  package:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install built wheel and smoke-test it
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          pdf-sanitizer --help
          pdf-sanitizer gui --help
          md-to-docx --help
          python -c "import pdf_sanitizer, pdf_sanitizer.gui; print(pdf_sanitizer.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
