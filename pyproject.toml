[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf-sanitizer"
version = "0.3.0"
description = "Local-first PDF to restart-safe semantic Markdown extractor with desktop GUI and DOCX export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taha Moeini" }]
dependencies = [
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
  "python-docx>=1.1.2,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
pdf-sanitizer = "pdf_sanitizer.cli:main"
pdf-sanitizer-gui = "pdf_sanitizer.gui:main"
md-to-docx = "pdf_sanitizer.cli:docx_main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_sanitizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on correctness-level lint failures. Broad style/policy rule sets
# are useful during review, but should not make deliberate parser fallbacks fail CI.
select = ["E4", "E7", "E9", "F"]
