[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glyphmend"
version = "0.3.3"
description = "Faithful document reconstruction from PDF to structured Markdown."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taha Moeini" }]
dependencies = [
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
  "python-docx>=1.1.2,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
glyphmend = "glyphmend.cli:main"
glyphmend-gui = "glyphmend.gui:main"
md-to-docx = "glyphmend.cli:docx_main"
# Compatibility aliases for scripts installed before the GlyphMend rebrand.
pdf-sanitizer = "pdf_sanitizer.cli:main"
pdf-sanitizer-gui = "pdf_sanitizer.gui:main"

[project.urls]
Homepage = "https://github.com/tahamoeini/glyph-mend"
Repository = "https://github.com/tahamoeini/glyph-mend"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphmend", "src/pdf_sanitizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI focused on correctness-level lint failures. Broad style/policy rule sets
# are useful during review, but should not make deliberate parser fallbacks fail CI.
select = ["E4", "E7", "E9", "F"]
