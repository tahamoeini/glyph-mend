[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf-sanitizer"
version = "0.1.0"
description = "Local-first PDF to sanitized Markdown extractor with tables, conservative vector-flow reconstruction, and visual placeholders."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taha Moeini" }]
dependencies = [
  "pymupdf==1.28.2",
  "pymupdf4llm==1.28.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
pdf-sanitizer = "pdf_sanitizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_sanitizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
